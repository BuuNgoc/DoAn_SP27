name: smart_travel_app
description: "SmartTravel - Smart Tourism Platform for Ngu Hanh Son (SE13)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  google_maps_flutter: ^2.19.0
  geolocator: ^14.0.1
  geoflutterfire_plus: ^0.0.34
  panorama_viewer: ^3.0.0
  just_audio: ^0.10.6
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  cached_network_image: ^4.0.4
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  google_sign_in: ^6.2.2
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
