name: smart_travel_app
description: "SmartTravel - Smart Tourism Platform for Ngu Hanh Son (SE13)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3

  # State Management & DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.7

  # Location & Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  geoflutterfire_plus: ^0.0.34

  # Media & VR & Audio
  panorama_viewer: ^0.1.3
  just_audio: ^0.9.40
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # QR Scanner & Generator
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Sharing & Utilities
  share_plus: ^10.0.2
  hive_flutter: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
